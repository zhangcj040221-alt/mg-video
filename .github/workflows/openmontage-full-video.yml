name: OpenMontage Full Asset Video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/openmontage-full/first-video/produce_full.py'
      - '.github/workflows/openmontage-full-video.yml'
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fivetaku/openmontage
          ref: main
          path: experiments/openmontage-full/upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native composer and asset/TTS tools
        run: |
          python -m pip install Pillow edge-tts
          cd experiments/openmontage-full/upstream/remotion-composer
          timeout 8m npm ci --no-audit --no-fund
      - name: Install Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          fc-cache -f
      - name: Acquire real visuals, generate Mandarin voice and music
        working-directory: experiments/openmontage-full/first-video
        run: timeout 6m python produce_full.py
      - name: Render original OpenMontage Explainer with visuals and sound
        working-directory: experiments/openmontage-full/upstream/remotion-composer
        run: |
          mkdir -p out
          timeout 15m npx remotion render src/index.tsx Explainer out/full-assets-chinese.mp4 --props ../../first-video/production-props.json --codec h264 --crf 19
      - name: Validate audio/video
        working-directory: experiments/openmontage-full/upstream/remotion-composer
        run: |
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out/full-assets-chinese.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/full-assets-chinese.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmontage-full-assets-chinese-video
          path: |
            experiments/openmontage-full/upstream/remotion-composer/out/full-assets-chinese.mp4
            experiments/openmontage-full/first-video/production-props.json
            experiments/openmontage-full/first-video/asset-credits.json
          if-no-files-found: warn
