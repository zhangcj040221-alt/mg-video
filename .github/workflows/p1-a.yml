name: P1 A Render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/p1-a/**'
      - '.github/workflows/p1-a.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/p1-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: timeout 5m npm install --no-audit --no-fund
      - name: Check composition
        run: timeout 2m npm run compositions
      - name: Render
        run: timeout 10m npm run render
      - name: Install ffprobe
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo 'ffprobe already available; skipping installation'
          else
            timeout 90s sudo apt-get -o Acquire::Retries=0 update -qq
            timeout 90s sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 install -y -qq ffmpeg
          fi
          command -v ffprobe
      - name: Verify MP4
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          video = Path('out/particle-path.mp4')
          assert video.is_file() and video.stat().st_size > 0, 'MP4 is missing or empty'
          result = subprocess.run(
              ['ffprobe','-v','error','-select_streams','v:0','-show_entries',
               'stream=width,height,avg_frame_rate,nb_frames,duration','-of','json',str(video)],
              capture_output=True,text=True,check=True,timeout=20
          )
          streams = json.loads(result.stdout).get('streams', [])
          assert streams, 'No video stream found'
          s = streams[0]
          print(json.dumps(s, indent=2))
          assert (s['width'],s['height']) == (1920,1080), 'Unexpected dimensions'
          assert s['avg_frame_rate'] == '30/1', 'Unexpected framerate'
          duration = float(s['duration'])
          assert abs(duration-8.0)<0.04, 'Unexpected duration'
          frames = int(s.get('nb_frames','240'))
          assert frames==240, 'Unexpected frame count'
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-a-remotion-mp4
          path: experiments/p1-a/out/particle-path.mp4
          if-no-files-found: warn
