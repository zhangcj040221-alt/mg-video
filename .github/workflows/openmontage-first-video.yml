name: OpenMontage First Full Video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/openmontage-full/first-video/**'
      - '.github/workflows/openmontage-first-video.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fivetaku/openmontage
          ref: main
          path: experiments/openmontage-full/upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original OpenMontage composer
        working-directory: experiments/openmontage-full/upstream/remotion-composer
        run: timeout 8m npm ci --no-audit --no-fund
      - name: Install Chinese fonts on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Render native upstream Explainer
        working-directory: experiments/openmontage-full/upstream/remotion-composer
        run: |
          mkdir -p out
          timeout 14m npx remotion render src/index.tsx Explainer out/first-explainer.mp4 \
            --props ../../first-video/props.json --codec h264 --crf 19
      - name: Check video
        working-directory: experiments/openmontage-full/upstream/remotion-composer
        run: |
          test -s out/first-explainer.mp4
          ls -lh out/first-explainer.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmontage-first-chinese-explainer
          path: experiments/openmontage-full/upstream/remotion-composer/out/first-explainer.mp4
          if-no-files-found: warn
