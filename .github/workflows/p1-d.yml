name: P1 D Upstream Component Render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/p1-d/**'
      - '.github/workflows/p1-d.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/p1-d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: timeout 5m npm install --no-audit --no-fund
      - name: Check composition
        run: timeout 2m npm run compositions
      - name: Render
        run: timeout 10m npm run render
      - name: Reuse Remotion bundled ffprobe
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remotion-bin"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = '@remotion/compositor-linux-x64-gnu';
          const root = path.dirname(require.resolve(pkg + '/package.json'));
          const found = fs.readdirSync(root, {recursive: true}).find(x => path.basename(x) === 'ffprobe');
          if (!found) throw new Error('Bundled ffprobe not found in ' + root);
          const target = path.join(process.env.RUNNER_TEMP, 'remotion-bin', 'ffprobe');
          fs.copyFileSync(path.join(root, found), target);
          fs.chmodSync(target, 0o755);
          fs.appendFileSync(process.env.GITHUB_PATH, path.dirname(target) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'LD_LIBRARY_PATH=' + root + ':' + (process.env.LD_LIBRARY_PATH || '') + '\n');
          NODE
          LD_LIBRARY_PATH="$(node -p "require('path').dirname(require.resolve('@remotion/compositor-linux-x64-gnu/package.json'))"):${LD_LIBRARY_PATH:-}" "$RUNNER_TEMP/remotion-bin/ffprobe" -version | head -1
      - name: Verify MP4
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          video = Path('out/p1-d.mp4')
          assert video.is_file() and video.stat().st_size > 0, 'MP4 is missing or empty'
          result = subprocess.run(
              ['ffprobe','-v','error','-select_streams','v:0','-show_entries',
               'stream=width,height,avg_frame_rate,nb_frames,duration','-of','json',str(video)],
              capture_output=True,text=True,check=True,timeout=20
          )
          streams = json.loads(result.stdout).get('streams', [])
          assert streams, 'No video stream found'
          s = streams[0]
          print(json.dumps(s, indent=2))
          assert (s['width'],s['height']) == (1920,1080), 'Unexpected dimensions'
          assert s['avg_frame_rate'] == '30/1', 'Unexpected framerate'
          duration = float(s['duration'])
          assert abs(duration-6.0)<0.04, 'Unexpected duration'
          frames = int(s.get('nb_frames','180'))
          assert frames==180, 'Unexpected frame count'
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-d-remotion-mp4
          path: experiments/p1-d/out/p1-d.mp4
          if-no-files-found: warn
